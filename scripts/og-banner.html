<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap");
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #08080c;
        color: #f1eee6;
        font-family: "Bricolage Grotesque", sans-serif;
      }
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 64px 72px;
        background:
          radial-gradient(ellipse 55% 50% at 8% 0%, rgba(212, 255, 63, 0.18), transparent 58%),
          radial-gradient(ellipse 45% 45% at 100% 100%, rgba(255, 77, 141, 0.14), transparent 55%),
          #08080c;
      }
      .kicker {
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #d4ff3f;
        margin: 0 0 28px;
      }
      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 0.92;
        letter-spacing: -0.04em;
        font-weight: 800;
        max-width: 920px;
      }
      h1 span {
        color: #d4ff3f;
      }
      .sub {
        margin: 36px 0 0;
        font-size: 28px;
        line-height: 1.3;
        color: #8a8694;
        max-width: 760px;
        font-weight: 500;
      }
      .loc {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8a8694;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="kicker">Creative Ctrl Collective</p>
      <h1>Sound, Culture<br /><span>&amp; Community</span></h1>
      <p class="sub">A multidisciplinary creative collective and production hub in Toronto, ON.</p>
      <p class="loc">Toronto · creativectrlcollective.org</p>
    </div>
  </body>
</html>
